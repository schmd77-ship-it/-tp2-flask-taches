<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion des étudiants</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="container">
      <h1>Gestion des étudiants</h1>

      <form method="POST" action="/" class="form-box">
        <div class="field">
          <label for="nom">Nom</label>
          <input type="text" id="nom" name="nom" placeholder="Entrez le nom" required />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Entrez l'email" required />
        </div>

        <button type="submit">Ajouter</button>
      </form>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>Email</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          {% for student in students %}
          <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.nom }}</td>
            <td>{{ student.email }}</td>
            <td>
              <form method="POST" action="{{ url_for('delete_student', id=student.id) }}">
                <button type="submit" class="delete-btn">Supprimer</button>
              </form>
            </td>
          </tr>
          {% else %}
          <tr>
            <td colspan="4">Aucun étudiant enregistré.</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </body>
</html>
